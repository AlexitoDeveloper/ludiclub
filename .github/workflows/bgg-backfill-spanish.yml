name: BGG Spanish Titles & Covers Backfill

# Automated daily cron removed: Spanish edition catalog backfill is 100% complete.
# To run on-demand or re-check games, trigger manually via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of games to inspect for Spanish editions"
        required: false
        default: "300"
        type: string

jobs:
  backfill:
    name: Backfill Spanish Editions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Spanish Titles & Covers Backfill
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          BGG_API_KEY: ${{ secrets.BGG_API_KEY }}
        run: |
          LIMIT="${{ inputs.limit || '300' }}"
          node scripts/backfill-spanish-titles.cjs --limit=$LIMIT
