name: Spanish Releases & Upcoming Sync

on:
  schedule:
    # Runs automatically every Monday and Thursday at 05:00 AM UTC (07:00 AM Spanish local time)
    - cron: "0 5 * * 1,4"
  workflow_dispatch:
    inputs:
      geeklist:
        description: "Optional BGG GeekList ID of Spanish releases to sync"
        required: false
        default: ""
        type: string

jobs:
  sync-spanish-releases:
    name: Sync Novedades & Próximamente (Spain)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Spanish Releases Sync Script
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BGG_API_KEY: ${{ secrets.BGG_API_KEY }}
        run: |
          if [ -n "${{ inputs.geeklist }}" ]; then
            node scripts/sync-spanish-releases.cjs --geeklist=${{ inputs.geeklist }}
          else
            node scripts/sync-spanish-releases.cjs
          fi
